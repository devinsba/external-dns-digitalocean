[project]
name = "external-dns-digitalocean"
version = "0.1.0"
description = "external-dns webhook provider for DigitalOcean DNS"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-requests>=0.66b2",
    "opentelemetry-instrumentation-system-metrics>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
external-dns-digitalocean = "external_dns_digitalocean.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
